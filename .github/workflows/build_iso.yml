name: Build Growth OS Bootable ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Build Bootable Arch Linux ISO via Docker
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            archlinux:base-devel bash -c "
              set -e
              echo '[+] Initializing Arch Linux build environment...'
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso git grub syslinux

              echo '[+] Copying base official releng profile...'
              cp -r /usr/share/archiso/configs/releng /tmp/growth-profile

              echo '[+] Appending Growth OS packages...'
              cat iso/packages.x86_64 >> /tmp/growth-profile/packages.x86_64
              # Deduplicate packages
              sort -u /tmp/growth-profile/packages.x86_64 -o /tmp/growth-profile/packages.x86_64

              echo '[+] Customizing profile metadata...'
              sed -i 's/iso_name=\"archlinux\"/iso_name=\"GrowthOS\"/' /tmp/growth-profile/profiledef.sh
              sed -i 's/iso_label=\"ARCH_\$(date +%Y%m)\"/iso_label=\"GROWTH_OS_\$(date +%Y%m)\"/' /tmp/growth-profile/profiledef.sh

              echo '[+] Injecting Growth OS code into rootfs...'
              mkdir -p /tmp/growth-profile/airootfs/usr/local/share/growth-os
              cp -r core /tmp/growth-profile/airootfs/usr/local/share/growth-os/
              cp -r daemons /tmp/growth-profile/airootfs/usr/local/share/growth-os/
              cp -r tools /tmp/growth-profile/airootfs/usr/local/share/growth-os/
              cp -r hud /tmp/growth-profile/airootfs/usr/local/share/growth-os/
              cp -r plugins /tmp/growth-profile/airootfs/usr/local/share/growth-os/
              cp -r config /tmp/growth-profile/airootfs/usr/local/share/growth-os/

              echo '[+] Injecting Hyprland, Waybar, Kitty, and Wofi configurations...'
              mkdir -p /tmp/growth-profile/airootfs/etc/skel/.config
              mkdir -p /tmp/growth-profile/airootfs/root/.config
              cp -r iso/airootfs/etc/skel/.config/* /tmp/growth-profile/airootfs/etc/skel/.config/
              cp -r iso/airootfs/etc/skel/.config/* /tmp/growth-profile/airootfs/root/.config/

              # Auto-start Hyprland on live boot tty1
              echo 'if [ -z \"\$DISPLAY\" ] && [ \"\$(tty)\" = \"/dev/tty1\" ]; then exec Hyprland; fi' >> /tmp/growth-profile/airootfs/root/.bash_profile
              echo 'if [ -z \"\$DISPLAY\" ] && [ \"\$(tty)\" = \"/dev/tty1\" ]; then exec Hyprland; fi' >> /tmp/growth-profile/airootfs/etc/skel/.bash_profile

              echo '[+] Building bootable ISO with mkarchiso...'
              mkdir -p /tmp/archiso-work
              mkdir -p iso/out
              mkarchiso -v -w /tmp/archiso-work -o iso/out /tmp/growth-profile

              echo '[✓] Build completed successfully!'
              ls -la iso/out/
            "

      - name: Upload Growth OS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrowthOS-x86_64-Live-ISO
          path: iso/out/*.iso
          retention-days: 14

      - name: Create Release with Bootable ISO
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: iso/out/*.iso
          tag_name: v1.0.0
          name: "Growth OS v1.0.0 - Bootable Live ISO"
          body: |
            ## Growth OS - Cognitive Engineering & Academic Operating System
            
            Flash this ISO to a USB drive using Rufus (in DD or ISO mode) or copy directly into a Ventoy drive.
            
            ### Included Features:
            * **Hyprland Wayland Desktop** with Catppuccin Mocha aesthetic and glassmorphism.
            * **Waybar Top HUD**: Real-time Focus score, JEE countdown ticker, targets, due recall cards.
            * **FSRS Spaced Repetition Engine**: Active retrieval drills with automatic countdowns.
            * **Mistake Ledger**: Error root-cause logging with auto-sync to recall.
            * **Observer Telemetry**: Auto-detects focus time on study sites (pw.live, etc.).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
