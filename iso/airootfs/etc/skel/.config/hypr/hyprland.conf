# =============================================================================
# GROWTH OS - HYPRLAND CONFIGURATION
# Aesthetic, distraction-free, hardware-accelerated Wayland tiling desktop
# =============================================================================

# Monitors
monitor=,preferred,auto,1

# Execute core services & status bar
exec-once = waybar &
exec-once = mako &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = python /usr/local/share/growth-os/daemons/observer.py &

# Input devices
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Visual Aesthetics & Glassmorphism
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # Neon cyan & lavender gradient border
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(313244aa)

    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }
    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    col.shadow = rgba(11111b66)
}

# Smooth 120Hz/60Hz animations
animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border, 1, 8, default
    animation = fade, 1, 5, smoothIn
    animation = workspaces, 1, 4, default, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Window Rules: Glassmorphism blur on terminals and readers
windowrulev2 = opacity 0.92 0.85, class:^(kitty)$
windowrulev2 = opacity 0.96 0.90, class:^(zathura)$
windowrulev2 = opacity 0.94 0.88, class:^(wofi)$

# =============================================================================
# KEYBINDINGS
# =============================================================================
$mainMod = SUPER

# Base Controls
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,

# --- GROWTH OS COGNITIVE ACCELERATORS ---
# 1. Quick Capture: Snip screen directly to Spaced Recall
bind = $mainMod SHIFT, S, exec, python /usr/local/share/growth-os/tools/quick_capture.py

# 2. Mistake Ledger: Instant capture of error
bind = $mainMod, M, exec, kitty --title "Mistake Ledger" -e python /usr/local/share/growth-os/tools/mistake_logger.py

# 3. Active Recall Drill: Timed FSRS testing
bind = $mainMod, R, exec, kitty --title "Active Recall Drill" -e python /usr/local/share/growth-os/tools/recall_runner.py

# 4. Question Trainer: +1 solved increment
bind = $mainMod, Right, exec, python -c "from daemons.question_trainer import question_trainer; question_trainer.next_question(True)"

# 5. War Mode: Toggle Monk Mode distraction firewall
bind = $mainMod, W, exec, python -c "from daemons.monk_guardian import monk_guardian; monk_guardian.enable_lockdown() if not monk_guardian.is_locked else monk_guardian.disable_lockdown()"

# Window Focus Navigation
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces (1 - 6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
